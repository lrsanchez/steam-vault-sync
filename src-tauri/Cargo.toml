[package]
name = "vaultsync"
version = "0.1.0"
description = "Steam Vault Sync — manage your Steam game vault across external SSDs"
authors = ["Leandro Sanchez <leandrorsanchez@gmail.com>"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/lrsanchez/steam-vault-sync"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vaultsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
keyvalues-parser = "0.2"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
sysinfo = "0.32"
walkdir = "2"
once_cell = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
